# .github/workflows/keepalive.yml
# Put this in the FALLOUT repo, next to index.html.
#
# Keeps the Supabase project "vault-560" from pausing. Supabase pauses a
# free project after roughly a week with no database activity; this makes
# one real query per day, well above the threshold.
#
# SETUP
#   1. Run rsvps-table.sql in the Supabase SQL Editor first. Without the
#      table this returns 404.
#   2. In THIS repo: Settings > Secrets and variables > Actions >
#      New repository secret
#        Name:  PARTY_ANON_KEY
#        Value: the sb_publishable_... key from Supabase > Settings > API Keys
#   3. Commit, then Actions > "Supabase keepalive" > Run workflow.

name: Supabase keepalive

on:
  schedule:
    # 15:22 UTC daily (8:22am Pacific). Off the hour on purpose: GitHub's
    # scheduler is congested at :00 and delays those runs.
    - cron: "22 15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping vault-560
        env:
          SUPABASE_URL: https://vfegwoidlgwwqrqezoss.supabase.co
          TABLE: rsvps
          ANON_KEY: ${{ secrets.PARTY_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANON_KEY:-}" ]; then
            echo "::error::PARTY_ANON_KEY secret is not set on this repository."
            exit 1
          fi
          # Only the apikey header. Authorization: Bearer expects a JWT, and
          # sb_publishable_ keys are not JWTs, so sending it can 401.
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $ANON_KEY")
          echo "HTTP $code"
          echo "Response: $(cat /tmp/body.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::401 = wrong or truncated key. 404 = the 'rsvps' table does not exist yet; run rsvps-table.sql in the Supabase SQL Editor."
            exit 1
          fi
          echo "vault-560 pinged successfully."
